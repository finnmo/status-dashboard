<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Status Board</title>

  <!-- Tailwind CSS – build-free CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- JustGage for the gauges -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/justgage/1.6.1/justgage.min.js"></script>

  <!-- Dark slate background for TV readability -->
  <style>
    html,body{height:100%}body{background:#0f172a;}
    .gauge-container {
      width: 250px;
      height: 260px;
      margin: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #1e293b;
      border-radius: 1rem;
      padding: 1.25rem;
    }
    .gauge-container > div {
      width: 100%;
      height: 100%;
    }
    .service-name {
      font-size: 1.125rem;
      font-weight: 600;
      color: #f8fafc;
      text-align: center;
      margin-bottom: 0.75rem;
      width: 100%;
    }
    .status-text {
      margin-top: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      width: 100%;
    }
    .status-text.online {
      color: #22c55e;
    }
    .status-text.offline {
      color: #ef4444;
    }
    #gauges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      padding: 1.5rem;
      max-width: 1800px;
      margin: 0 auto;
    }
  </style>
</head>

<body class="min-h-full flex flex-col items-center justify-center p-6">
  <h1 class="text-3xl font-semibold text-white mb-10">
    Service Status
  </h1>

  <!-- Grid that will hold 8 (or any number of) gauges -->
  <div id="gauges"></div>

  <!-- Toasts land here (fixed, top-right) -->
  <div id="toast-container" class="fixed top-4 right-4 space-y-3 z-50"></div>

  <!-- ────────────────────────────────────────────────────────────────
       config.js is *generated* by the GitHub Actions workflow.
       It defines   window.SERVICE_CONFIG = [ { url: "https://…", name: "…" }, … ];
       ──────────────────────────────────────────────────────────────── -->
  <script src="config.js"></script>

  <!-- Main dashboard logic (your existing gauge + toast code) -->
  <script type="module" src="dashboard.js"></script>
</body>
</html>
