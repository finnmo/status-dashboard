name: Build & Deploy Status Board
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Individual service secrets
      SERVICE_1_URL: ${{ secrets.SERVICE_1_URL }}
      SERVICE_1_NAME: ${{ secrets.SERVICE_1_NAME }}
      SERVICE_2_URL: ${{ secrets.SERVICE_2_URL }}
      SERVICE_2_NAME: ${{ secrets.SERVICE_2_NAME }}
      SERVICE_3_URL: ${{ secrets.SERVICE_3_URL }}
      SERVICE_3_NAME: ${{ secrets.SERVICE_3_NAME }}
      SERVICE_4_URL: ${{ secrets.SERVICE_4_URL }}
      SERVICE_4_NAME: ${{ secrets.SERVICE_4_NAME }}
      SERVICE_5_URL: ${{ secrets.SERVICE_5_URL }}
      SERVICE_5_NAME: ${{ secrets.SERVICE_5_NAME }}
      SERVICE_6_URL: ${{ secrets.SERVICE_6_URL }}
      SERVICE_6_NAME: ${{ secrets.SERVICE_6_NAME }}
      SERVICE_7_URL: ${{ secrets.SERVICE_7_URL }}
      SERVICE_7_NAME: ${{ secrets.SERVICE_7_NAME }}
    steps:
    - uses: actions/checkout@v4

    # 1 → Write config.js **inside the publish folder** (./dist by convention)
    - name: Generate run-time config
      run: |
        mkdir -p dist
        echo "/* generated $(date -u) */" > dist/config.js
        echo "window.SERVICE_CONFIG = [" >> dist/config.js
        
        # Add each service if both URL and NAME are set
        if [ ! -z "$SERVICE_1_URL" ] && [ ! -z "$SERVICE_1_NAME" ]; then
          echo "  { url: \"$SERVICE_1_URL\", name: \"$SERVICE_1_NAME\" }," >> dist/config.js
        fi
        if [ ! -z "$SERVICE_2_URL" ] && [ ! -z "$SERVICE_2_NAME" ]; then
          echo "  { url: \"$SERVICE_2_URL\", name: \"$SERVICE_2_NAME\" }," >> dist/config.js
        fi
        if [ ! -z "$SERVICE_3_URL" ] && [ ! -z "$SERVICE_3_NAME" ]; then
          echo "  { url: \"$SERVICE_3_URL\", name: \"$SERVICE_3_NAME\" }," >> dist/config.js
        fi
        if [ ! -z "$SERVICE_4_URL" ] && [ ! -z "$SERVICE_4_NAME" ]; then
          echo "  { url: \"$SERVICE_4_URL\", name: \"$SERVICE_4_NAME\" }," >> dist/config.js
        fi
        if [ ! -z "$SERVICE_5_URL" ] && [ ! -z "$SERVICE_5_NAME" ]; then
          echo "  { url: \"$SERVICE_5_URL\", name: \"$SERVICE_5_NAME\" }," >> dist/config.js
        fi
        if [ ! -z "$SERVICE_6_URL" ] && [ ! -z "$SERVICE_6_NAME" ]; then
          echo "  { url: \"$SERVICE_6_URL\", name: \"$SERVICE_6_NAME\" }," >> dist/config.js
        fi
        if [ ! -z "$SERVICE_7_URL" ] && [ ! -z "$SERVICE_7_NAME" ]; then
          echo "  { url: \"$SERVICE_7_URL\", name: \"$SERVICE_7_NAME\" }," >> dist/config.js
        fi
        
        # Remove trailing comma and close array
        sed -i '$ s/,$//' dist/config.js
        echo "];" >> dist/config.js

    # 2 → Copy static files
    - name: Copy static site
      run: |
        rsync -av --exclude '.env' src/ dist/

    # 3 → Deploy to GitHub Pages
    - uses: actions/upload-pages-artifact@v3
      with:
        path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy
      id-token: write   # to verify deployment
    steps:
    - uses: actions/deploy-pages@v4
