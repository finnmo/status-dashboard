name: Build & Deploy Status Board
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      SERVICES: ${{ secrets.SERVICES }}

    steps:
    - uses: actions/checkout@v4

    # Debug: Print environment variables (without values for security)
    - name: Debug environment variables
      run: |
        echo "Checking if SERVICES secret is set:"
        if [ ! -z "$SERVICES" ]; then
          echo "SERVICES is configured"
          # Count the number of services (comma-separated)
          service_count=$(echo "$SERVICES" | tr -cd ',' | wc -c)
          service_count=$((service_count + 1))
          echo "Number of services configured: $service_count"
        else
          echo "Error: SERVICES is not configured"
          exit 1
        fi

    # 1 → Write config.js **inside the publish folder** (./dist by convention)
    - name: Generate run-time config
      run: |
        mkdir -p dist
        
        # Create a temporary JSON file
        echo "[" > config.json
        
        # Function to add a service
        add_service() {
          local service=$1
          if [ ! -z "$service" ]; then
            # Split the service string into name and URL
            IFS='|' read -r name url <<< "$service"
            # Remove any newlines and escape special characters
            name=$(echo "$name" | tr -d '\n\r' | sed 's/"/\\"/g')
            url=$(echo "$url" | tr -d '\n\r' | sed 's/"/\\"/g')
            echo "  {\"url\":\"$url\",\"name\":\"$name\"}," >> config.json
            return 0
          fi
          return 1
        }
        
        # Add each service from the SERVICES environment variable
        IFS=',' read -ra SERVICE_ARRAY <<< "$SERVICES"
        for service in "${SERVICE_ARRAY[@]}"; do
          add_service "$service"
        done
        
        # Remove trailing comma and close array
        sed -i '$ s/,$//' config.json
        echo "]" >> config.json
        
        # Validate JSON
        if ! jq . config.json > /dev/null 2>&1; then
          echo "Error: Invalid JSON generated"
          echo "Raw config.json content:"
          cat config.json
          echo "Trying to fix JSON..."
          # Try to fix the JSON by removing any remaining newlines
          sed -i 's/\n//g' config.json
          sed -i 's/\r//g' config.json
          if ! jq . config.json > /dev/null 2>&1; then
            echo "Error: Could not fix JSON"
            exit 1
          fi
        fi
        
        # Create the final config.js
        echo "/* generated $(date -u) */" > dist/config.js
        echo "window.SERVICE_CONFIG = $(cat config.json);" >> dist/config.js
        
        # Debug: Show the generated config (without sensitive data)
        echo "Generated config.js structure:"
        cat dist/config.js | grep -v "url:" | grep -v "name:"
        
        # Verify the config is not empty
        if [ ! -s dist/config.js ]; then
          echo "Error: config.js is empty!"
          exit 1
        fi

    # 2 → Copy static files
    - name: Copy static site
      run: |
        rsync -av --exclude '.env' src/ dist/

    # 3 → Deploy to GitHub Pages
    - uses: actions/upload-pages-artifact@v3
      with:
        path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages  # Explicitly specify the environment
    permissions:
      pages: write      # to deploy
      id-token: write   # to verify deployment
    steps:
    - uses: actions/deploy-pages@v4
