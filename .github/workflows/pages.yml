name: Build & Deploy Status Board
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Service URLs
      CURTIN_WEBSITE_URL: ${{ secrets.CURTIN_WEBSITE_URL }}
      SMART_CAMPUS_URL: ${{ secrets.SMART_CAMPUS_URL }}
      TRAKKA_URL: ${{ secrets.TRAKKA_URL }}
      POWER_MONITORING_EXPERT_URL: ${{ secrets.POWER_MONITORING_EXPERT_URL }}
      PARKAID_OUTDOOR_URL: ${{ secrets.PARKAID_OUTDOOR_URL }}
      PARKAID_UNDERGROUND_URL: ${{ secrets.PARKAID_UNDERGROUND_URL }}
      PARKING_SIGNAGE_URL: ${{ secrets.PARKING_SIGNAGE_URL }}
      
      # Service Names
      CURTIN_WEBSITE_NAME: ${{ secrets.CURTIN_WEBSITE_NAME }}
      SMART_CAMPUS_NAME: ${{ secrets.SMART_CAMPUS_NAME }}
      TRAKKA_NAME: ${{ secrets.TRAKKA_NAME }}
      POWER_MONITORING_EXPERT_NAME: ${{ secrets.POWER_MONITORING_EXPERT_NAME }}
      PARKAID_OUTDOOR_NAME: ${{ secrets.PARKAID_OUTDOOR_NAME }}
      PARKAID_UNDERGROUND_NAME: ${{ secrets.PARKAID_UNDERGROUND_NAME }}
      PARKING_SIGNAGE_NAME: ${{ secrets.PARKING_SIGNAGE_NAME }}
    steps:
    - uses: actions/checkout@v4

    # Debug: Print environment variables (without values for security)
    - name: Debug environment variables
      run: |
        echo "Checking if secrets are set:"
        if [ ! -z "$CURTIN_WEBSITE_URL" ] && [ ! -z "$CURTIN_WEBSITE_NAME" ]; then
          echo "Curtin Website is configured"
        fi
        if [ ! -z "$SMART_CAMPUS_URL" ] && [ ! -z "$SMART_CAMPUS_NAME" ]; then
          echo "Smart Campus is configured"
        fi
        if [ ! -z "$TRAKKA_URL" ] && [ ! -z "$TRAKKA_NAME" ]; then
          echo "Trakka is configured"
        fi
        if [ ! -z "$POWER_MONITORING_EXPERT_URL" ] && [ ! -z "$POWER_MONITORING_EXPERT_NAME" ]; then
          echo "Power Monitoring Expert is configured"
        fi
        if [ ! -z "$PARKAID_OUTDOOR_URL" ] && [ ! -z "$PARKAID_OUTDOOR_NAME" ]; then
          echo "ParkAid Outdoor is configured"
        fi
        if [ ! -z "$PARKAID_UNDERGROUND_URL" ] && [ ! -z "$PARKAID_UNDERGROUND_NAME" ]; then
          echo "ParkAid Underground is configured"
        fi
        if [ ! -z "$PARKING_SIGNAGE_URL" ] && [ ! -z "$PARKING_SIGNAGE_NAME" ]; then
          echo "Parking Signage is configured"
        fi

    # 1 → Write config.js **inside the publish folder** (./dist by convention)
    - name: Generate run-time config
      run: |
        mkdir -p dist
        echo "/* generated $(date -u) */" > dist/config.js
        echo "window.SERVICE_CONFIG = [" >> dist/config.js
        
        # Add each service if both URL and NAME are set
        if [ ! -z "$CURTIN_WEBSITE_URL" ] && [ ! -z "$CURTIN_WEBSITE_NAME" ]; then
          echo "  { url: \"$CURTIN_WEBSITE_URL\", name: \"$CURTIN_WEBSITE_NAME\" }," >> dist/config.js
        fi
        if [ ! -z "$SMART_CAMPUS_URL" ] && [ ! -z "$SMART_CAMPUS_NAME" ]; then
          echo "  { url: \"$SMART_CAMPUS_URL\", name: \"$SMART_CAMPUS_NAME\" }," >> dist/config.js
        fi
        if [ ! -z "$TRAKKA_URL" ] && [ ! -z "$TRAKKA_NAME" ]; then
          echo "  { url: \"$TRAKKA_URL\", name: \"$TRAKKA_NAME\" }," >> dist/config.js
        fi
        if [ ! -z "$POWER_MONITORING_EXPERT_URL" ] && [ ! -z "$POWER_MONITORING_EXPERT_NAME" ]; then
          echo "  { url: \"$POWER_MONITORING_EXPERT_URL\", name: \"$POWER_MONITORING_EXPERT_NAME\" }," >> dist/config.js
        fi
        if [ ! -z "$PARKAID_OUTDOOR_URL" ] && [ ! -z "$PARKAID_OUTDOOR_NAME" ]; then
          echo "  { url: \"$PARKAID_OUTDOOR_URL\", name: \"$PARKAID_OUTDOOR_NAME\" }," >> dist/config.js
        fi
        if [ ! -z "$PARKAID_UNDERGROUND_URL" ] && [ ! -z "$PARKAID_UNDERGROUND_NAME" ]; then
          echo "  { url: \"$PARKAID_UNDERGROUND_URL\", name: \"$PARKAID_UNDERGROUND_NAME\" }," >> dist/config.js
        fi
        if [ ! -z "$PARKING_SIGNAGE_URL" ] && [ ! -z "$PARKING_SIGNAGE_NAME" ]; then
          echo "  { url: \"$PARKING_SIGNAGE_URL\", name: \"$PARKING_SIGNAGE_NAME\" }," >> dist/config.js
        fi
        
        # Remove trailing comma and close array
        sed -i '$ s/,$//' dist/config.js
        echo "];" >> dist/config.js
        
        # Debug: Show the generated config (without sensitive data)
        echo "Generated config.js structure:"
        cat dist/config.js | grep -v "url:" | grep -v "name:"

    # 2 → Copy static files
    - name: Copy static site
      run: |
        rsync -av --exclude '.env' src/ dist/

    # 3 → Deploy to GitHub Pages
    - uses: actions/upload-pages-artifact@v3
      with:
        path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy
      id-token: write   # to verify deployment
    steps:
    - uses: actions/deploy-pages@v4
